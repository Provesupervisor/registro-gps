<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro GPS Clientes &mdash; Provefabrica</title>
<style>
  :root{
    --azul:#0B2A4A;
    --azul-claro:#16456f;
    --rojo:#e2231a;
    --rojo-osc:#b81912;
    --acento:#FF7A1A;
    --acento-osc:#e0640a;
    --verde:#1e9e54;
    --verde-claro:#e6f6ec;
    --rojoerr:#d23b3b;
    --rojo-claro:#fdeaea;
    --gris:#5a6a7a;
    --gris-cl:#eef2f6;
    --linea:#d9e1ea;
    --blanco:#ffffff;
    --texto:#13212f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0B2A4A 0%,#16456f 100%);
    color:var(--texto);
    min-height:100vh;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card{
    background:var(--blanco);
    width:100%;
    max-width:440px;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .head{
    background:var(--azul);
    color:#fff;
    padding:22px 22px 18px;
    text-align:center;
  }
  .logo-wrap{
    background:#fff;
    border-radius:12px;
    padding:12px 16px;
    display:inline-block;
    margin-bottom:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .logo-wrap img{display:block;height:38px;width:auto;}
  .head h1{font-size:21px;margin:0;font-weight:700;line-height:1.25;}
  .head p{font-size:13px;margin:7px 0 0;color:#aac3da;}
  .body{padding:20px 20px 24px;}
  label{
    display:block;font-size:13px;font-weight:700;color:var(--azul);
    margin:0 0 6px 2px;
  }
  .campo{margin-bottom:16px;}
  input[type=text]{
    width:100%;padding:14px 14px;font-size:17px;
    border:1.5px solid var(--linea);border-radius:12px;
    background:#fafcfe;color:var(--texto);outline:none;
    transition:border .15s;
  }
  input[type=text]:focus{border-color:var(--acento);background:#fff;}
  input[readonly]{background:var(--gris-cl);color:var(--gris);font-weight:600;}
  .gps-box{
    border:1.5px dashed var(--linea);
    border-radius:14px;padding:16px;margin-bottom:18px;
    background:#f7fafd;text-align:center;
  }
  .gps-title{font-size:13px;font-weight:700;color:var(--azul);margin-bottom:12px;}
  .btn-gps{
    width:100%;border:none;border-radius:13px;
    background:var(--acento);color:#fff;
    font-size:18px;font-weight:800;padding:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 6px 16px rgba(255,122,26,.35);
    transition:transform .08s,background .15s;
  }
  .btn-gps:active{transform:scale(.98);background:var(--acento-osc);}
  .btn-gps.cargando{background:var(--gris);box-shadow:none;}
  .btn-gps .pin{font-size:22px;}
  .coords{display:flex;gap:10px;margin-top:14px;}
  .coords .campo{flex:1;margin-bottom:0;}
  .coords label{font-size:11px;}
  .coords input{font-size:15px;padding:11px;text-align:center;}
  .estado{margin-top:12px;font-size:13px;font-weight:600;min-height:18px;border-radius:9px;padding:0;}
  .estado.ok{color:var(--verde);background:var(--verde-claro);padding:9px;}
  .estado.err{color:var(--rojoerr);background:var(--rojo-claro);padding:9px;}
  .estado.info{color:var(--gris);}
  .precision{font-size:11px;color:var(--gris);margin-top:4px;}
  .btn-enviar{
    width:100%;border:none;border-radius:13px;
    background:var(--verde);color:#fff;
    font-size:18px;font-weight:800;padding:17px;
    cursor:pointer;margin-top:6px;
    box-shadow:0 6px 16px rgba(30,158,84,.32);
    transition:transform .08s,opacity .15s;
  }
  .btn-enviar:active{transform:scale(.98);}
  .btn-enviar:disabled{background:#9fb4c4;box-shadow:none;cursor:not-allowed;}
  .btn-limpiar{
    width:100%;border:1.5px solid var(--linea);border-radius:13px;
    background:#fff;color:var(--gris);
    font-size:15px;font-weight:700;padding:13px;
    cursor:pointer;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s,border-color .15s;
  }
  .btn-limpiar:active{background:var(--gris-cl);border-color:var(--gris);}
  .pie{text-align:center;font-size:11px;color:#88a3bd;margin-top:16px;line-height:1.6;}
  .pie .autor{color:var(--azul);font-weight:700;font-size:12px;}
  .pie .cargo{color:var(--gris);font-size:11px;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
    background:var(--azul);color:#fff;padding:14px 22px;border-radius:30px;
    font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0;transition:transform .3s,opacity .3s;z-index:99;
    display:flex;align-items:center;gap:9px;max-width:90%;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.ok{background:var(--verde);}
  .toast.err{background:var(--rojoerr);}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gira .7s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
</style>
</head>

      </div>
      <h1>Registro GPS de Clientes</h1>
      <p>Captura la ubicaci&oacute;n parado frente al cliente</p>
    </div>

    <div class="body">
      <div class="campo">
        <label for="factura">N&deg; de Factura</label>
        <input type="text" id="factura" placeholder="Ej: F001-12345" autocomplete="off">
      </div>

      <div class="campo">
        <label for="cliente">Nombre del Cliente</label>
        <input type="text" id="cliente" placeholder="Ej: Muebler&iacute;a San Juan" autocomplete="off">
      </div>

      <div class="gps-box">
        <div class="gps-title">&#128205; Ubicaci&oacute;n del cliente</div>
        <button class="btn-gps" id="btnGps" onclick="capturar()">
          <span class="pin">&#128205;</span><span id="txtGps">Capturar ubicaci&oacute;n</span>
        </button>
        <div class="coords">
          <div class="campo">
            <label>Latitud</label>
            <input type="text" id="lat" readonly placeholder="&mdash;">
          </div>
          <div class="campo">
            <label>Longitud</label>
            <input type="text" id="lng" readonly placeholder="&mdash;">
          </div>
        </div>
        <div class="estado info" id="estado">Toca el bot&oacute;n estando en el punto de entrega.</div>
        <div class="precision" id="precision"></div>
      </div>

      <div class="campo">
        <label for="chofer">Chofer</label>
        <input type="text" id="chofer" placeholder="Tu nombre" autocomplete="off">
      </div>

      <button class="btn-enviar" id="btnEnviar" onclick="enviar()" disabled>
        Guardar registro
      </button>

      <button class="btn-limpiar" id="btnLimpiar" onclick="limpiar()">
        &#128260; Limpiar campos
      </button>

      <div class="pie">
        La ubicaci&oacute;n se guarda en la base de Distribuci&oacute;n.<br>
        Mant&eacute;n el GPS del celular activado.<br><br>
        <span class="autor">Creaci&oacute;n de Walter Malpartida</span><br>
        <span class="cargo">Supervisor de Despacho y Distribuci&oacute;n</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSepuSBj1lu-6AOjwGANPhBCwbGL73tDBpq0BEHcRUqi6PxZtQ/formResponse";
  const ENTRY = {
    factura: "entry.1874716530",
    cliente: "entry.578798907",
    lat:     "entry.1422322628",
    lng:     "entry.1082550277",
    chofer:  "entry.1746881965"
  };

  let tieneGps = false;
  const $ = id => document.getElementById(id);

  function toast(msg, tipo){
    const t = $("toast");
    t.className = "toast show " + (tipo||"");
    t.innerHTML = msg;
    setTimeout(()=>{ t.className = "toast " + (tipo||""); }, 2600);
  }

  function capturar(){
    if(!navigator.geolocation){
      setEstado("Tu dispositivo no soporta GPS.", "err");
      return;
    }
    const btn = $("btnGps");
    btn.classList.add("cargando");
    $("txtGps").innerHTML = '<span class="spin"></span> Buscando se&ntilde;al...';
    setEstado("Obteniendo ubicaci&oacute;n, espera unos segundos...", "info");
    $("precision").textContent = "";

    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const acc = Math.round(pos.coords.accuracy);
        $("lat").value = lat;
        $("lng").value = lng;
        tieneGps = true;
        btn.classList.remove("cargando");
        $("txtGps").textContent = "Volver a capturar";
        setEstado("\u2713 Ubicaci\u00f3n capturada correctamente.", "ok");
        $("precision").textContent = "Precisi\u00f3n aproximada: \u00b1" + acc + " m";
        revisar();
      },
      err => {
        btn.classList.remove("cargando");
        $("txtGps").textContent = "Reintentar captura";
        let m = "No se pudo obtener la ubicaci\u00f3n.";
        if(err.code === 1) m = "Permiso denegado. Activa la ubicaci\u00f3n para este sitio.";
        else if(err.code === 2) m = "Sin se\u00f1al GPS. Sal a un espacio abierto e intenta de nuevo.";
        else if(err.code === 3) m = "Tard\u00f3 demasiado. Reintenta.";
        setEstado("\u26a0 " + m, "err");
      },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  }

  function setEstado(txt, tipo){
    const e = $("estado");
    e.innerHTML = txt;
    e.className = "estado " + tipo;
  }

  function revisar(){
    const ok = $("factura").value.trim() && $("cliente").value.trim()
             && $("chofer").value.trim() && tieneGps;
    $("btnEnviar").disabled = !ok;
  }

  ["factura","cliente","chofer"].forEach(id=>{
    $(id).addEventListener("input", revisar);
  });

  function enviar(){
    if($("btnEnviar").disabled) return;
    const btn = $("btnEnviar");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    const datos = new URLSearchParams();
    datos.append(ENTRY.factura, $("factura").value.trim());
    datos.append(ENTRY.cliente, $("cliente").value.trim());
    datos.append(ENTRY.lat, $("lat").value);
    datos.append(ENTRY.lng, $("lng").value);
    datos.append(ENTRY.chofer, $("chofer").value.trim());

    fetch(FORM, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: datos.toString()
    }).then(()=>{ exito(); }).catch(()=>{ exito(); });
  }

  function exito(){
    toast("\u2713 Registro guardado", "ok");
    const chofer = $("chofer").value;
    $("factura").value = "";
    $("cliente").value = "";
    $("lat").value = "";
    $("lng").value = "";
    $("chofer").value = chofer;
    tieneGps = false;
    $("txtGps").textContent = "Capturar ubicaci\u00f3n";
    setEstado("Listo para el siguiente cliente.", "info");
    $("precision").textContent = "";
    const btn = $("btnEnviar");
    btn.textContent = "Guardar registro";
    btn.disabled = true;
    $("factura").focus();
  }

  function limpiar(){
    $("factura").value = "";
    $("cliente").value = "";
    $("lat").value = "";
    $("lng").value = "";
    $("chofer").value = "";
    tieneGps = false;
    $("txtGps").textContent = "Capturar ubicaci\u00f3n";
    $("btnGps").classList.remove("cargando");
    setEstado("Campos reiniciados. Listo para un nuevo registro.", "info");
    $("precision").textContent = "";
    $("btnEnviar").disabled = true;
    toast("\u21bb Campos limpiados");
    $("factura").focus();
  }
</script>
</body>
</html>
